<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d">
  <title id="t">How to check a domain renewal notice</title>
  <desc id="d">A renewal notice arrives. Do not use any link, phone number, or reply slip in it. Log in to your registrar yourself. Compare the registrar name and the expiry date. If they match and the domain is due, renew inside your own account. If not, shred the notice and report it.</desc>
  <rect width="1200" height="675" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#63171d"/>
    </marker>
  </defs>
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" fill="#2a2a2a">
    <text x="600" y="70" text-anchor="middle" font-size="34" font-weight="700">The two-minute renewal notice check</text>

    <rect x="60" y="120" width="320" height="150" rx="14" fill="#f3f4f6" stroke="#e5e7eb" stroke-width="2"/>
    <text x="220" y="165" text-anchor="middle" font-size="22" fill="#63171d" font-weight="700">STEP 1</text>
    <text x="220" y="205" text-anchor="middle" font-size="24" font-weight="600">A renewal notice</text>
    <text x="220" y="237" text-anchor="middle" font-size="24" font-weight="600">arrives</text>

    <rect x="440" y="120" width="320" height="150" rx="14" fill="#ffffff" stroke="#63171d" stroke-width="3"/>
    <text x="600" y="165" text-anchor="middle" font-size="22" fill="#63171d" font-weight="700">STEP 2</text>
    <text x="600" y="205" text-anchor="middle" font-size="24" font-weight="600">Ignore its link, phone</text>
    <text x="600" y="237" text-anchor="middle" font-size="24" font-weight="600">number, and reply slip</text>

    <rect x="820" y="120" width="320" height="150" rx="14" fill="#f3f4f6" stroke="#e5e7eb" stroke-width="2"/>
    <text x="980" y="165" text-anchor="middle" font-size="22" fill="#63171d" font-weight="700">STEP 3</text>
    <text x="980" y="205" text-anchor="middle" font-size="24" font-weight="600">Type your registrar's</text>
    <text x="980" y="237" text-anchor="middle" font-size="24" font-weight="600">address and log in</text>

    <line x1="380" y1="195" x2="432" y2="195" stroke="#63171d" stroke-width="4" marker-end="url(#a)"/>
    <line x1="760" y1="195" x2="812" y2="195" stroke="#63171d" stroke-width="4" marker-end="url(#a)"/>

    <path d="M980 270 V310 H600 V338" fill="none" stroke="#63171d" stroke-width="4" marker-end="url(#a)"/>
    <rect x="310" y="345" width="580" height="120" rx="14" fill="#63171d"/>
    <text x="600" y="390" text-anchor="middle" font-size="22" fill="#ffffff" font-weight="700">STEP 4</text>
    <text x="600" y="428" text-anchor="middle" font-size="25" fill="#ffffff" font-weight="600">Same company? Is the domain really due?</text>

    <path d="M480 465 V520 H330 V548" fill="none" stroke="#63171d" stroke-width="4" marker-end="url(#a)"/>
    <path d="M720 465 V520 H870 V548" fill="none" stroke="#63171d" stroke-width="4" marker-end="url(#a)"/>
    <text x="395" y="508" text-anchor="middle" font-size="22" font-weight="700">Yes</text>
    <text x="805" y="508" text-anchor="middle" font-size="22" font-weight="700">No</text>

    <rect x="110" y="555" width="440" height="90" rx="14" fill="#f3f4f6" stroke="#e5e7eb" stroke-width="2"/>
    <text x="330" y="593" text-anchor="middle" font-size="24" font-weight="600">Renew inside your</text>
    <text x="330" y="625" text-anchor="middle" font-size="24" font-weight="600">own account</text>

    <rect x="650" y="555" width="440" height="90" rx="14" fill="#ffffff" stroke="#63171d" stroke-width="3"/>
    <text x="870" y="593" text-anchor="middle" font-size="24" font-weight="600">Shred it and report it.</text>
    <text x="870" y="625" text-anchor="middle" font-size="24" font-weight="600">Pay nothing.</text>
  </g>
</svg>
